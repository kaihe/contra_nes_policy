defaults:
  - config
  - _self_

# Paper-scale ROCKET-2 settings (hiddim 1024, 4 layers, 128-step windows, 9 view
# tokens, mem_len 128). This is the config.yaml of the reference repo, retargeted to
# Contra's backbone and action space. It does NOT fit a 16GB GPU — it is the config
# for a real multi-GPU box.
#
#   python train.py --config-name config_xl devices=8

# At timesteps=128 a window is 25MB, so num_workers here assumes a server with
# >=128GB host RAM — check the [dataset] RAM estimate printed at startup.
batch_size: 4
num_workers: 8
devices: 8
accumulate_grad_batches: 1
val_check_interval: 5000

model:
  hiddim: 1024
  num_layers: 4
  timesteps: 128
  mem_len: 128
  num_view_tokens: 9
