# Experiment 0028: binary-reward actor-critic PPO from the validated 49% Laser policy.
defaults:
  - laser_projection
  - _self_

hydra:
  run:
    dir: ./runs/ppo/${now:%Y-%m-%d}/laser-critic-${now:%H-%M-%S}

init_from: ${hydra:runtime.cwd}/runs/grpo/2026-08-26/laser-projection-16-40-25/checkpoints/grpo-000025.pt
resume_from: null

warmup:
  episodes: 512
  chunk_episodes: 128
  validation_episodes: 128
  epochs: 3

rollout:
  episodes_per_update: 128

ppo:
  gamma: 1.0
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_coef: 0.5
  kl_coef: 0.02
  entropy_coef: 0.01
  target_kl: 0.02
  max_grad_norm: 1.0

train:
  updates: 200
  max_hours: 2.5
  max_kl_ref: 0.10
  epochs: 1
  minibatch_episodes: 8
  actor_learning_rate: 2.0e-6
  critic_learning_rate: 1.0e-4
  weight_decay: 0.0
  save_every: 25
