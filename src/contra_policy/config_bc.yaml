hydra:
  run:
    dir: ./runs/bc/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: true

# ── data ──────────────────────────────────────────────────────────────────────
# One item is one whole episode at its natural length. The context holds an entire
# episode, so windows are no longer the unit — and padding every episode to the context
# would be 201 MB of uint8 frames per item.
shard_dir: ~/code/contra_nes_data/game_trace/hf
shard_overrides: {}
# Read exact cumulative membership from the release contract. `shard_count` is the
# experiment cell (1, 2, 4 or 8); no directory glob is allowed to define it.
boss_scaling:
  enabled: true
  manifest: ~/code/contra_nes_data/game_trace/releases/boss-mixed-v2/manifest.json
  shard_count: 1
  validation_sha256: 131835e34c55f75ded04410976730600a866744b40a8525bfc4d7f9ab952ecad
expected_episodes: {train: {}, val: {}}
cache_dir: ${hydra:runtime.cwd}/cache
# Precomputed frozen-encoder tokens (doc/0013 §2.3). When `train` is set, the loader reads
# only these directories — no tar, no PyAV, no cv2 — and `policy.forward_tokens` replaces
# the encoder forward, which is ~97% of a step. Requires `policy.freeze_encoder: true`:
# a trainable encoder cannot be served from a cache of its own past outputs.
# Build with `tools/build_token_cache.py`. Startup asserts the cache's encoder sha256
# matches `policy.encoder_ckpt`, so a stale cache raises rather than training silently.
token_cache:
  train: null
  val: null
families: [kill, item, traverse, boss]
image_size: 256
sigma_px: 12.0            # must match the export and the prompt renderer

seed: 0
resume_from: null
device: cuda
precision: bf16           # bf16 | fp16 | fp32

# ── policy ────────────────────────────────────────────────────────────────────
policy:
  # Stage A's trained encoder. Frozen by default and that is the experiment: it makes
  # the causal core the only thing that changed, so a bad validation loss is the core's
  # fault. Unfreeze once the bet is confirmed.
  encoder_ckpt: ${hydra:runtime.cwd}/runs/encoder/2026-07-31/18-00-11/checkpoints/encoder-final.pt
  freeze_encoder: true
  value_head: false       # BC has no value target; GRPO has no learned critic
  aux_size: 0             # no heatmap head or geometric readout in the base policy
  # Images per encoder forward. A whole-episode batch is batch x T frames — 4 x 519 is
  # 2,076 at 256px. Chunking held the peak at 1.59 GB against 4.68 GB unchunked at 548,
  # so one long boss episode cannot OOM a run that was fine a step earlier.
  encode_chunk: 256
  core:
    n_layer: 4            # the VPT core it replaces was 4 x 512 x 8 heads, 12.77M
    n_head: 8
    n_kv_head: 8          # = n_head is plain MHA; fewer is GQA, not needed at this size
    # Longest BC episode is 519 frames + 2 prefix. 1024 leaves room for RL, which runs
    # to the full budget (max 1038) rather than the demo it came from — and costs
    # nothing extra, because attention tracks actual length, not capacity.
    context: 1024
    mlp_ratio: 4.0
    rope_theta: 10000.0
    dropout: 0.0
    # d_model is taken from the encoder's hiddim; setting it here would be a second
    # source of truth for a number that must match.

# ── loader ────────────────────────────────────────────────────────────────────
loader:
  # Episodes per batch. Frames per step is this times the batch's longest episode, so a
  # boss batch is far heavier than an item batch. `tokens_per_sec` follows Karpathy's
  # dense GPT-compute convention and therefore includes padding and the two prefix tokens.
  batch_size: 4
  # LengthGroupedSampler sorts within a pool of this many batches rather than globally.
  # Global sorting would put every long episode together, and length correlates with
  # family (traverse long, item short), so a batch would be nearly one family.
  pool_batches: 32
  # One reference cycle reproduces 0006's family episode counts. Each experiment cell
  # gets this same number of draws; only the distinct boss pool changes.
  family_draws: {kill: 2290, item: 455, traverse: 3693, boss: 666}
  num_workers: 2
  prefetch_factor: 2

# ── optimisation ──────────────────────────────────────────────────────────────
train:
  steps: 20000
  learning_rate: 3.0e-4   # the core is from scratch; only the encoder is pretrained
  weight_decay: 0.01
  warmup_steps: 500
  # `wsd` is this repo's schedule and should stay that way: cosine defines its LR against
  # `steps`, reaching 0 exactly at the end, so a finished run can never be extended and
  # every budget costs a run from scratch. WSD holds the LR flat after warmup and anneals
  # only over the last `decay_frac`, so any stable-phase checkpoint can be resumed into a
  # *longer* budget — a 20k/40k/80k ladder becomes one trunk plus short anneals. `_resume`
  # enforces exactly that: it will extend a wsd run and refuse to extend a cosine one.
  lr_decay: wsd           # none | cosine | wsd
  decay_frac: 0.1         # cooldown as a fraction of `steps`; the last 10% by default
  final_lr_frac: 0.0      # LR multiplier at the end of the cooldown
  max_grad_norm: 1.0
  log_every: 50
  val_every: 1000
  save_steps: [3000, 10000]
  # Batches per in-run validation. 0 in `val_full` means the whole validation set.
  val_batches: 60
