hydra:
  run:
    dir: ./runs/encoder/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: true

# ── data ──────────────────────────────────────────────────────────────────────
# Both targets are rendered by `goal.goal_mask`, the same renderer that draws the
# cross-view prompt, from fields already in each episode's .json:
#
#   entity occupancy (4 ch) <- `entities`, from the 2026-07-30 re-export
#
# Both image kinds are trained: agent frames, and the episode's goal frame located by
# `goal_frame_idx`. A goal frame IS an episode frame with the target painted on, so it
# carries the same 4-class target — no special case anywhere.
#
# Shards older than that re-export have no `entities` field; the loader falls back to an
# all-zero target rather than failing.
shard_dir: ~/code/contra_nes_data/game_trace/hf
cache_dir: ${hydra:runtime.cwd}/cache
families: [kill, item, traverse, boss]
sigma_px: 12.0            # must match the export, the BC run and the prompt renderer

seed: 0
device: cuda
precision: bf16           # bf16 | fp16 | fp32

# ── encoder ───────────────────────────────────────────────────────────────────
encoder:
  image_size: 256
  hiddim: 512             # token width; must equal the policy's hiddim to plug in
  depth: 32               # ConvEncoder base width — 1024 channels on a 4x4 grid at 256px
  minres: 4
  # Channels kept after a 1x1 reduction of the trunk's 1024, before flattening to a
  # token. Flattening 1024x4x4 straight into a Linear is 8.4M parameters per projection
  # — more than the trunk itself; reducing first costs 0.26M and makes it 2.4M.
  proj_ch: 256
  aux_size: 32            # heatmap grid A; point_err_px is calibrated at A=32
  head_depth: 32
  # player / player_bullets / enemies / enemy_bullets. The only occupancy target since
  # 0002 — the encoder is goal-agnostic and goal matching is the policy's job.
  entity_classes: 4
  # 0002 §4, an open question rather than a default: a decoder is 7M at recon_depth 16
  # (27.97M at full width), and the precedent only shows a recon-*only* encoder goes
  # entity-blind, not that recon adds anything once an entity head exists. Ablate it.
  reconstruct: false
  recon_depth: 16
  # An `ae_pretrained.pt` from contra_agent/dreamer/train_ae.py, to initialise the conv
  # trunk. null = from scratch.
  view_backbone_ckpt: null
  # False on purpose, and the whole reason this package exists: the policy freezes the
  # trunk, so its grounding loss only ever reached the projection layers. Here the
  # gradient has to reach the convolutions or the token cannot learn to keep sprites.
  freeze_view_backbone: false

# ── loss ──────────────────────────────────────────────────────────────────────
loss:
  # These maps are 95-98% empty, so unweighted BCE is minimised by predicting "empty
  # everywhere". Applied per cell as 1 + pos_weight * target.
  entity_pos_weight: 10.0
  # Only used when encoder.reconstruct is on.
  recon_weight: 1.0
  # Tighter than the goal's 12 px: at A=32 that is 1.66 cells, which smears a boss
  # frame's ~4.9 enemy bullets into one blob. 6 px is 0.83 cells.
  entity_sigma_px: 6.0

# ── loader ────────────────────────────────────────────────────────────────────
loader:
  # Decode efficiency only, NOT a model parameter: frames are independent here and get
  # shuffled into batches anyway. Larger windows mean fewer tar seeks per frame.
  win_len: 32
  # Windows per loader batch. The real frame batch is win_len x this, minus padding —
  # so 4 x 32 = ~128 frames per step. Host RAM is the binding constraint on this box
  # (20 GB WSL VM); the loader prints its own in-flight estimate at startup.
  batch_size: 4
  num_workers: 2
  prefetch_factor: 2

# ── optimisation ──────────────────────────────────────────────────────────────
train:
  steps: 20000
  learning_rate: 3.0e-4   # from scratch, so much higher than the BC/RL fine-tune LRs
  weight_decay: 0.01
  warmup_steps: 500
  lr_decay: cosine        # none | cosine
  max_grad_norm: 1.0
  log_every: 50
  # Validation is the gate, so it runs often enough to catch a regression early but not
  # often enough to dominate: ~50 batches every 1000 steps.
  val_every: 1000
  # In-run curve: a fixed 50-batch subset (6.4% of val, 613 boss frames). Same frames
  # every time, so the trend is comparable across steps.
  val_batches: 50
  # The closing pass, which is what the gate is read off. 0 = the entire val set
  # (781 batches, ~3 min) so all 10,128 val boss frames count. Reported as `val_full`.
  final_val_batches: 0
  save_every: 2000
logger: csv               # csv | wandb
project: contra-encoder
