defaults:
  - config
  - _self_

# ── Run: prev-action token off ────────────────────────────────────────────────
#
#     python train.py --config-name config_noprev
#
# The 0728 evaluation measured the prev-action token as *negative* at rollout:
# dropping it took pooled completion 56.5% → 63.5% and macro 45.9% → 60.0%, with the
# gain concentrated on item (pick_spread 25.0 → 66.7, pick_rapid 18.2 → 54.5) and
# kill (50.2 → 65.1). The mechanism is a feedback loop — the policy conditions on its
# own last action and locks in, which is what drove idle to 48.9% in the leaky run.
# That measurement was made by *ablating the token at rollout on a model trained with
# it*, which is off-distribution; this config trains without it, so the comparison is
# honest in both directions.
#
# Second-order benefit: the per-timestep block drops from 6 tokens to 5, so the
# recurrent core's sequence shortens by a sixth at the same window length, and the
# interaction token becomes the last token — the policy head and the aux head then
# read the same position, which is fine (it has attended over the whole timestep) but
# worth knowing when reading the aux metrics.

model:
  use_prev_action: false

# Nothing to drop or keep, so the dropout knob is inert here. Left at the inherited
# value rather than deleted, so hyperparameter diffs against the baseline stay clean.
# prev_action_keep_prob: 0.25

# The other Tier-3 knobs stay at their config.yaml defaults (off) on purpose: this run
# exists to measure one variable. Turn them on in follow-up runs, one at a time:
#   python train.py --config-name config_noprev action_loss_alpha=0.5
#   python train.py --config-name config_noprev family_balance_alpha=0.5
#   python train.py --config-name config_noprev carry_memory=true
