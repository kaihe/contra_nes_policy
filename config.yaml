hydra:
  run:
    dir: ./runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: true

# ── data ──────────────────────────────────────────────────────────────────────
# Shards are pre-split by contra_nes_data: <config>-{train,val}-00000.tar. The split
# is the data repo's and is not reproduced here — see dataset.py's module docstring.
shard_dir: ~/code/contra_nes_data/game_trace/hf
configs: [kill, item, traverse, boss]
cache_dir: ${hydra:runtime.cwd}/cache
sigma_px: 12.0            # goal-blob std in source screen pixels (matches the export)
prev_action_keep_prob: 0.25   # ROCKET-2 drops the prev action 75% of the time

# ── optimisation ──────────────────────────────────────────────────────────────
batch_size: 16            # 5.4GB VRAM at timesteps=32 on a 16GB card
# Each worker is single-threaded (see _worker_init) and saturates one core decoding,
# so on this 32-core box worker count IS the data throughput. At 4 workers the GPU sat
# at 18% utilization; 12 should saturate it.
#
# Size this by PSS, not RSS: a worker shows ~1.3GB RSS but only ~0.37GB PSS, the rest
# being shared copy-on-write pages. 12 workers ≈ 7GB of this 20GB WSL VM. Check with:
#   for p in $(pgrep -P $(pgrep -f "python train.py"|head -1)); do \
#     awk '/^Pss:/{s+=$2} END{print s/1e6" GB"}' /proc/$p/smaps_rollup; done
#
# More workers also smooth the ~2.2x per-window cost spread between shards (boss and
# item windows are much dearer than traverse); with too few workers that spread makes
# the iteration rate oscillate rather than settle.
num_workers: 12
prefetch_factor: 2
devices: 1
precision: bf16-mixed
learning_rate: 0.00004
weight_decay: 0.001
warmup_steps: 2000
max_epochs: 20             # matches the 2026-07-25 run (weight-epoch=4) for comparison
max_steps: -1            # -1 = unlimited; set for a short smoke run
accumulate_grad_batches: 1
gradient_clip_val: 1.0
save_freq: 2000
ckpt_path: null
seed: 0

# ── objective weights ─────────────────────────────────────────────────────────
bc_weight: 1.0
# Dense goal-occupancy grounding, replacing ROCKET-2's exist+point+bbox scalars.
# pos_weight offsets the blob's ~1.7% area share at aux_size=32 / sigma_px=12.
heatmap_weight: 1.0
heatmap_pos_weight: 10.0
label_smoothing: 0.0

# ── sampling and class balance (all default to off — one variable per run) ─────
# BC class weight ∝ (median_freq / freq) ** alpha. 0 = unweighted. Aimed at the
# under-aiming gap: UR is 10.0% of training steps but 2.2% of rollout actions.
action_loss_alpha: 0.0
# Flattens the family step mix (traverse 65.2%, item 2.8%) by this exponent.
# 0 = natural mix, 1 = fully equalised (~23x on item, too aggressive), 0.5 between.
family_balance_alpha: 0.0
# Walk each episode's windows in order across `batch_size` lanes and hand the
# attention memory forward. Off, every window trains from an empty memory, so
# mem_len is never populated at all and window position 0 sees a single frame.
carry_memory: false

# ── logging ───────────────────────────────────────────────────────────────────
logger: csv                # csv | wandb
project: contra-rocket2
log_every_n_steps: 20
val_check_interval: 1000
limit_val_batches: 50

# ── model ─────────────────────────────────────────────────────────────────────
# Scaled to fit a 16GB GPU. The view backbone is the frozen Contra autoencoder from
# contra_agent/dreamer/train_ae.py; image_size and view_depth MUST match what that
# checkpoint was trained at (256px / depth 32) or loading raises.
model:
  image_size: 256
  view_depth: 32
  mask_depth: 8
  minres: 4
  view_backbone_ckpt: ~/code/contra_agent/tmp/dreamer/ae_pretrained.pt
  freeze_view_backbone: true
  hiddim: 512
  num_heads: 8
  num_layers: 4
  timesteps: 32           # window length; also the dataloader's win_len
  mem_len: 32
  use_prev_action: true
  num_view_tokens: 4
  aux_size: 32            # goal-heatmap resolution; must match the dataset target
